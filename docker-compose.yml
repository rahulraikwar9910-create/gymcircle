version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: gymcircle-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gymcircle
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gymcircle-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gymcircle-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/gymcircle
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=super_secret_jwt_signing_key_replace_in_production
      - JWT_REFRESH_SECRET=super_secret_jwt_refresh_signing_key_replace_in_production
      - ENVIRONMENT=development
    depends_on:
      - db
      - redis

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: gymcircle-web
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./web:/var/www/html
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
